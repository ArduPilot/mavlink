# DISABLED in ArduPilot/mavlink: copied from mavlink/mavlink but not run here.
#
# Not yet evaluated for this repo's CI. This repo's policy on what counts as
# an acceptable break may differ from upstream's (for example ArduPilot also
# needs to know when a generated _send() signature changes, which matters
# because ArduPilot calls those functions with positional arguments).
# scripts/check_api_break.py can be run by hand meanwhile:
#   python3 scripts/check_api_break.py -b <base-ref>
#
# To enable: restore the commented-out `on:` block below (and remove the
# `on: workflow_call:` that replaces it), and remove the `if: false` line
# from each job.

name: Check MAVLink API Breaks

# Upstream triggers (disabled):
# on:
#   pull_request:
#   push:
#     branches:
#       - master
#   workflow_dispatch:
on:
  workflow_call:  # never called, so this workflow never runs

# This job runs against untrusted PR content (it checks out and executes
# the PR branch's own script/tests), so it must not hold any token beyond
# the default read-only access - not even for same-repo PRs. It writes any
# PR comment it wants posted to an artifact instead of calling the GitHub
# API itself; see post_api_break_comment.yml for why and how that's posted.
permissions:
  contents: read

jobs:
  check-api-break:
    if: false  # disabled, see the comment at the top of this file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install lxml

      - name: Run check_api_break unit tests
        run: python -m unittest scripts/test_check_api_break.py -v

      - name: Run API break check
        run: python scripts/check_api_break.py

      - name: Upload PR comment artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-break-comment
          path: api-break-comment/
          retention-days: 1
          if-no-files-found: ignore
